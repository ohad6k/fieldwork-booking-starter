# Added by `npx -y viberaven init --github-action`. Fails a PR only on a proven two-request race.
# Runs on every PR so it can be a required check; PRs without SQL, route or race-rule changes finish in about a second.
name: VibeRaven
on:
  pull_request:
permissions:
  contents: read
  checks: write
concurrency:
  group: viberaven-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  check:
    name: VibeRaven check
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/viberaven-check
